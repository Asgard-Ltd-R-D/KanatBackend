name: Build Cross-Platform Artifacts

# ===================================================================
# 🔔 TRIGGERS
# ===================================================================
on:
  # Run automatically after tests finish successfully
  workflow_run:
    workflows: ["Test PacketProcessingService"]
    types: [completed]

  # Allow manual run or local act testing
  workflow_dispatch:

  # Rebuild when relevant paths change
  push:
    paths:
      - "Composer_cli/**"
      - "PacketProcessingService/**"
      - ".github/workflows/build.yml"
    branches:
      - "main"
      - "master"
      - "feature/**"
      - "fix/**"

  pull_request:
    paths:
      - "Composer_cli/**"
      - "PacketProcessingService/**"
      - ".github/workflows/build.yml"
    branches:
      - "main"
      - "master"
      - "feature/**"
      - "fix/**"

# ===================================================================
# 🏗️ BUILD LINUX INSTALLERS (multi-arch)
# ===================================================================
jobs:
  build-linux:
    name: 🏗️ Build installer (${{ matrix.rid }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            docker_platform: linux/amd64
          - rid: linux-arm64
            docker_platform: linux/arm64

    env:
      KANAT_TARGET_RID: ${{ matrix.rid }}
      KANAT_BUILD_PLATFORM: ${{ matrix.rid }}
      KANAT_DOCKER_PLATFORM: ${{ matrix.docker_platform }}
      DOCKER_BUILDKIT: 1
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🐧 Setup QEMU (for cross-architecture builds)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: image=moby/buildkit:latest
          buildkitd-flags: --debug

      - name: ♻️ Cache Docker image exports
        uses: actions/cache@v4
        with:
          path: artifacts/releases/images/${{ matrix.rid }}
          key: docker-cache-${{ matrix.rid }}-${{ hashFiles('docker-compose.prod.yml', 'QuestDB/Dockerfile') }}
          restore-keys: docker-cache-${{ matrix.rid }}-

      - name: 🧱 Build installer
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_DEFAULT_PLATFORM="${KANAT_DOCKER_PLATFORM}"
          echo "🛠️ Building for platform ${KANAT_DOCKER_PLATFORM}"

          # 🧩 Ensure tkinter is available for Python scripts that need it
          echo "Installing tkinter for headless build..."
          sudo apt-get update -y
          sudo apt-get install -y python3-tk

          docker buildx inspect --bootstrap
          docker version
          ./build_artifacts.sh "${KANAT_TARGET_RID}"

      - name: 📦 Package installer tar
        shell: bash
        run: |
          mkdir -p artifacts/packages
          src_dir="artifacts/installers/${KANAT_BUILD_PLATFORM}"
          src_file="installer-${KANAT_BUILD_PLATFORM}.run"
          tar_path="artifacts/packages/kanat-installer-${KANAT_BUILD_PLATFORM}.tar"
          if [ ! -f "${src_dir}/${src_file}" ]; then
            echo "❌ Missing ${src_dir}/${src_file}" >&2
            exit 1
          fi
          tar -cf "${tar_path}" -C "${src_dir}" "${src_file}"
          echo "✅ Created ${tar_path}"

      - name: ⬆️ Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanat-installer-${{ matrix.rid }}
          path: artifacts/packages/kanat-installer-${{ matrix.rid }}.tar

      - name: 📤 Upload docker image cache
        uses: actions/upload-artifact@v4
        with:
          name: kanat-docker-image-${{ matrix.rid }}
          path: artifacts/releases/images/${{ matrix.rid }}

  # ===================================================================
  # 🏗️ BUILD NON-LINUX INSTALLERS (Windows & macOS)
  # ===================================================================
  build-nonlinux:
    needs: build-linux
    name: 🏗️ Build installer (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
          - os: windows-latest
            platform: win-arm64
          - os: macos-latest
            platform: osx-arm64
          - os: macos-13
            platform: osx-x64

    env:
      KANAT_TARGET_RID: ${{ matrix.platform }}
      KANAT_BUILD_PLATFORM: ${{ matrix.platform }}
      DOCKER_BUILDKIT: 1
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 📥 Download matching docker image cache
        uses: actions/download-artifact@v4
        with:
          name: kanat-docker-image-linux-x64
          path: artifacts/releases/images/linux-x64

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ⚙️ Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 🧱 Build installer
        shell: bash
        run: |
          set -euo pipefail
          ./build_artifacts.sh "${KANAT_BUILD_PLATFORM}"

      - name: 📦 Package installer tar
        shell: bash
        run: |
          mkdir -p artifacts/packages
          src_dir="artifacts/installers/${KANAT_BUILD_PLATFORM}"
          src_file="installer-${KANAT_BUILD_PLATFORM}.run"
          tar_path="artifacts/packages/kanat-installer-${KANAT_BUILD_PLATFORM}.tar"
          [ -f "${src_dir}/${src_file}" ] || { echo "❌ Missing ${src_dir}/${src_file}" >&2; exit 1; }
          tar -cf "${tar_path}" -C "${src_dir}" "${src_file}"
          echo "✅ Created ${tar_path}"

      - name: ⬆️ Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanat-installer-${{ matrix.platform }}
          path: artifacts/packages/kanat-installer-${{ matrix.platform }}.tar

  # ===================================================================
  # 🚀 RELEASE JOB
  # ===================================================================
  release:
    name: 📦 Publish Release
    needs:
      - build-linux
      - build-nonlinux
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧮 Bump version tag
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: "v"
          release_branches: main,master,feature/*,fix/*
          dry_run: false

      - name: 📥 Download packaged installers
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          pattern: kanat-installer-*
          merge-multiple: true

      - name: ⚖️ Determine release type
        id: prerelease_check
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ]]; then
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Publish GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: Kanat Installer ${{ steps.version.outputs.new_tag }}
          prerelease: ${{ steps.prerelease_check.outputs.prerelease }}
          body: |
            ## Installer Artifacts
            Built automatically for:
            - linux-x64
            - linux-arm64
            - win-x64
            - win-arm64
            - osx-arm64
            - osx-x64
          files: release_artifacts/**/*.tar
