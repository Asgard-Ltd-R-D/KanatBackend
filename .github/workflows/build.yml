name: Build and Deploy Cross-Platform Artifacts

# ===================================================================
# 🔔 TRIGGERS
# ===================================================================
on:
  # Run automatically after tests finish successfully
  workflow_run:
    workflows: ["Test PacketProcessingService"]
    types: [completed]

  # Allow manual run or local act testing
  workflow_dispatch:

  # Rebuild when relevant paths change
  push:
    paths:
      - "Composer_cli/**"
      - "PacketProcessingService/**"
      - ".github/workflows/build.yml"
    branches:
      - "main"
      - "master"
      - "feature/**"
      - "fix/**"

  pull_request:
    paths:
      - "Composer_cli/**"
      - "PacketProcessingService/**"
      - ".github/workflows/build.yml"
    branches:
      - "main"
      - "master"
      - "feature/**"
      - "fix/**"

# ===================================================================
# ⚙️ JOBS
# ===================================================================
jobs:
  build:
    name: Build Installers (Linux host, multi-arch)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    if: >
      ${{ github.event.workflow_run.conclusion == 'success' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'push' }}

    steps:
      # --------------------------------------------------------------
      # 1️⃣ Checkout source
      # --------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------------
      # 2️⃣ Setup environment
      # --------------------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Enable QEMU for cross-architecture builds
        uses: docker/setup-qemu-action@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Tk dependencies (Linux host)
        run: |
          sudo apt-get update
          sudo apt-get install -y tk-dev python3-tk

      # --------------------------------------------------------------
      # 3️⃣ Run builds for all OS targets under current arch
      # --------------------------------------------------------------
      - name: Build all targets for ${{ matrix.arch }}
        run: |
          set -e
          echo "🏗️ Building for architecture: ${{ matrix.arch }}"
          mkdir -p installers

          for os_target in linux windows macos; do
            platform="${os_target}-${{ matrix.arch }}"
            file_name="kanat-installer-${platform}.tar"
            echo "🔧 Building $platform..."
            bash ./build_artifacts.sh "$platform"
            tar -cvf "installers/${file_name}" -C artifacts .
          done

      # --------------------------------------------------------------
      # 4️⃣ Upload all generated tarballs for this arch
      # --------------------------------------------------------------
      - name: Upload installer tarballs
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.arch }}
          path: installers/*.tar

  # ===================================================================
  # 🏁 CREATE RELEASE
  # ===================================================================
  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./collected_installers

      - name: Display collected installers
        run: ls -R ./collected_installers || true

      - name: Determine release type
        id: rel
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [[ "$BRANCH" == "main" || "$BRANCH" == "master" ]]; then
            echo "release_type=release" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == feature/* || "$BRANCH" == fix/* ]]; then
            echo "release_type=pre-release" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "release_type=unknown" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: ${{ steps.rel.outputs.release_type != 'unknown' }}
        with:
          tag_name: v${{ github.run_number }}
          name: "Kanat Build ${{ github.run_number }} - ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ steps.rel.outputs.prerelease }}
          files: |
            collected_installers/**/*.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
