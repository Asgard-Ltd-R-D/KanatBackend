name: Build Cross-Platform Artifacts

# ===================================================================
# 🔔 TRIGGERS
# ===================================================================
on:
  # Run automatically after tests finish successfully
  workflow_run:
    workflows: ["Test PacketProcessingService"]
    types: [completed]

  # Allow manual run or local act testing
  workflow_dispatch:

  # Rebuild when relevant paths change
  push:
    paths:
      - "Composer_cli/**"
      - "PacketProcessingService/**"
      - ".github/workflows/build.yml"
    branches:
      - "main"
      - "master"
      - "develop"
      - "feature/**"
  pull_request:
    paths:
      - "Composer_cli/**"
      - "PacketProcessingService/**"
      - ".github/workflows/build.yml"

# ===================================================================
# 🐳 BUILD DOCKER IMAGES (Linux only)
# ===================================================================
jobs:
  build-images:
    name: 🐳 Build Docker images (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    permissions:
      contents: read
      packages: write

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🧱 Build QuestDB and other Docker images
        run: |
          set -e
          mkdir -p artifacts/releases/images
          echo "Building Docker images for ${{ matrix.arch }}..."

          # Buildx automatically uses the runner's native arch, 
          # so no explicit --platform flag is required
          docker buildx build \
            --load \
            -t kanat-questdb:${{ matrix.arch }} \
            -f QuestDB/Dockerfile .

          docker save kanat-questdb:${{ matrix.arch }} \
            > artifacts/releases/images/questdb-${{ matrix.arch }}.tar

          echo "✅ Exported artifacts/releases/images/questdb-${{ matrix.arch }}.tar"

      - name: 📦 Upload image artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-${{ matrix.arch }}
          path: artifacts/releases/images/
          retention-days: 3

  # ===================================================================
  # 🏗️ BUILD INSTALLERS (all OSes)
  # ===================================================================
  build-installers:
    name: 🏗️ Build installers (${{ matrix.platform }})
    needs: build-images
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 platforms
          - os: ubuntu-latest
            platform: linux-x64
            arch: x64
          - os: macos-13
            platform: osx-x64
            arch: x64
          - os: windows-latest
            platform: win-x64
            arch: x64
          # arm64 platforms
          - os: ubuntu-latest
            platform: linux-arm64
            arch: arm64
          - os: macos-latest
            platform: osx-arm64
            arch: arm64
          - os: windows-latest
            platform: win-arm64
            arch: arm64

    env:
      KANAT_BUILD_PLATFORM: ${{ matrix.platform }}
      KANAT_TARGET_RID: ${{ matrix.platform }}
      KANAT_ARCH: ${{ matrix.arch }}
      PYTHONUTF8: "1"

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 📥 Download prebuilt Docker images for this arch
        uses: actions/download-artifact@v4
        with:
          name: docker-images-${{ matrix.arch }}
          path: artifacts/releases/images

      - name: 🐳 Load Docker image (Linux/macOS only)
        if: runner.os != 'Windows'
        run: |
          docker load < artifacts/releases/images/questdb-${{ matrix.arch }}.tar || echo "⚠️ Docker load skipped"

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🔁 Add python3 shim (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\shim" | Out-Null
          Set-Content -Path "$env:RUNNER_TEMP\shim\python3.cmd" -Value "@echo off`r`npython %*"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\shim"

      - name: ⚙️ Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 🧱 Build installer using build_artifacts.sh
        run: |
          set -euo pipefail
          chmod +x ./build_artifacts.sh
          ./build_artifacts.sh "${KANAT_BUILD_PLATFORM}"

      - name: 📦 Package installer tar
        shell: bash
        run: |
          mkdir -p artifacts/packages
          src_dir="artifacts/installers/${KANAT_BUILD_PLATFORM}"
          src_file="installer-${KANAT_BUILD_PLATFORM}.run"
          tar_path="artifacts/packages/kanat-installer-${KANAT_BUILD_PLATFORM}.tar"
          if [ ! -f "${src_dir}/${src_file}" ]; then
            echo "❌ Missing ${src_dir}/${src_file}"
            exit 1
          fi
          tar -cf "${tar_path}" -C "${src_dir}" "${src_file}"
          echo "✅ Created ${tar_path}"

      - name: ⬆️ Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanat-installer-${{ matrix.platform }}
          path: artifacts/packages/kanat-installer-${{ matrix.platform }}.tar

  # ===================================================================
  # 🚀 PUBLISH RELEASE (main/master only)
  # ===================================================================
  release:
    name: 🚀 Publish GitHub Release
    needs: build-installers
    if: ${{ github.ref_name == 'main' || github.ref_name == 'master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: ⬇️ Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧮 Auto-increment version
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: "v"
          release_branches: main,master

      - name: 📥 Download all installers
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: 📝 Generate release notes
        run: |
          cat <<'EOF' > notes.md
          ## Kanat Installer Artifacts

          Each platform installer includes:
          - Built binaries
          - Prepackaged Docker image (QuestDB)
          - Cross-platform composer utility

          ### Platforms:
          - linux-x64
          - linux-arm64
          - win-x64
          - win-arm64
          - osx-x64
          - osx-arm64
          EOF

      - name: 🚀 Publish GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: Kanat Installer ${{ steps.version.outputs.new_tag }}
          prerelease: false
          body_path: notes.md
          files: release_artifacts/**/*.tar
