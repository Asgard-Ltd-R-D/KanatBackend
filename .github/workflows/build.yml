name: Build Cross-Platform Artifacts

on:
  workflow_run:
    workflows: ["Test PacketProcessingService"] # Waits for test.yml to complete (tests must pass)
    types:
      - completed
  workflow_dispatch: # Allow manual run

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: 🏗️ Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 🏗️ Build project
        run: |
          dotnet publish PacketProcessingService/PacketProcessingService.csproj \
            -c Release \
            -r ${{ matrix.os == 'ubuntu-latest' && 'linux-x64' || (matrix.os == 'windows-latest' && 'win-x64' || 'osx-x64') }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o artifacts/${{ matrix.os }}

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kanat-${{ matrix.os }}
          path: artifacts/${{ matrix.os }}
