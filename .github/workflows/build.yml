name: Build Cross-Platform Artifacts

# ===================================================================
# 🔔 TRIGGERS
# ===================================================================
on:
  # Run automatically after tests finish successfully
  workflow_run:
    workflows: ["Test PacketProcessingService"]
    types: [completed]

  # Allow manual run or local act testing
  workflow_dispatch:

  # Rebuild when relevant paths change
  push:
    paths:
      - "Composer_cli/**"
      - "PacketProcessingService/**"
      - ".github/workflows/build.yml"
    branches:
      - "main"
      - "master"
      - "develop"
      - "feature/**"

  pull_request:
    paths:
      - "Composer_cli/**"
      - "PacketProcessingService/**"
      - ".github/workflows/build.yml"

# ===================================================================
# 🏗️ BUILD INSTALLERS (single Linux runner for all logical OSes)
# ===================================================================
jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    name: 🏗️ Build installer (${{ matrix.platform }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Core Linux architectures (real docker builds) ---
          - platform: linux-x64
            arch: amd64
          - platform: linux-arm64
            arch: arm64

          # --- Logical targets for Windows and macOS (same Docker builds) ---
          - platform: win-x64
            arch: amd64
          - platform: win-arm64
            arch: arm64
          - platform: osx-x64
            arch: amd64
          - platform: osx-arm64
            arch: arm64

    env:
      KANAT_TARGET_RID: ${{ matrix.platform }}
      KANAT_BUILD_PLATFORM: ${{ matrix.platform }}
      KANAT_ARCH: ${{ matrix.arch }}
      DOCKER_BUILDKIT: 1
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      # --------------------------------------------------------------
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ♻️ Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: linux-nuget-${{ hashFiles('**/*.sln', '**/*.csproj') }}
          restore-keys: linux-nuget-

      - name: ♻️ Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: linux-pip-${{ hashFiles('build_artifacts.sh', 'composer.py') }}
          restore-keys: linux-pip-

      # --------------------------------------------------------------
      # Docker setup (for both amd64 and arm64)
      # --------------------------------------------------------------
      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: 🐳 Verify Docker platform
        run: docker buildx ls

      # --------------------------------------------------------------
      # Environment setup
      # --------------------------------------------------------------
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------------------
      # Setup .NET 8 SDK
      # --------------------------------------------------------------
      - name: ⚙️ Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # --------------------------------------------------------------
      # Build artifacts for target platform (but always on Linux)
      # --------------------------------------------------------------
      - name: 🧱 Build installer
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_artifacts.sh
          echo "🚀 Building artifacts for ${KANAT_BUILD_PLATFORM} (arch=${KANAT_ARCH})"
          ./build_artifacts.sh "${KANAT_BUILD_PLATFORM}"

      - name: 📂 List installer payload
        shell: bash
        run: |
          ls -R artifacts/installers || true

      - name: 📦 Package installer tar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/packages
          src_dir="artifacts/installers/${KANAT_BUILD_PLATFORM}"
          src_file="installer-${KANAT_BUILD_PLATFORM}.run"
          if [ ! -f "${src_dir}/${src_file}" ]; then
            echo "❌ Missing installer payload: ${src_dir}/${src_file}" >&2
            exit 1
          fi
          tar_path="artifacts/packages/kanat-installer-${KANAT_BUILD_PLATFORM}.tar"
          tar -cf "${tar_path}" -C "${src_dir}" "${src_file}"
          echo "✅ Created ${tar_path}"

      - name: ⬆️ Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanat-installer-${{ matrix.platform }}
          path: artifacts/packages/kanat-installer-${{ matrix.platform }}.tar

  # ===================================================================
  # 🚀 RELEASE JOB — Automatically pre-release for non-main branches
  # ===================================================================
  release:
    name: 📦 Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # --------------------------------------------------------------
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------------
      - name: 🧮 Bump version tag
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: "v"
          release_branches: main,master
          dry_run: false

      # --------------------------------------------------------------
      - name: 📥 Download packaged installers
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      # --------------------------------------------------------------
      - name: 📝 Compose release notes
        run: |
          cat <<'EOF' > notes.md
          ## Kanat Installer Artifacts

          Each installer contains:
          - Compiled binaries
          - Prebuilt Docker images (built internally by build_artifacts.sh)
          - docker-compose definitions and QuestDB setup
          - Platform-specific Composer CLI

          ### Included Targets
          - linux-x64 / linux-arm64
          - win-x64 / win-arm64
          - osx-x64 / osx-arm64
          EOF

      # --------------------------------------------------------------
      # 🚀 Determine if this should be a pre-release
      # --------------------------------------------------------------
      - name: ⚖️ Determine release type
        id: prerelease_check
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ]]; then
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "🌟 Main or Master branch detected — full release."
          else
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "🚧 Non-main branch detected — pre-release will be created."
          fi

      # --------------------------------------------------------------
      # 🚀 Publish GitHub release
      # --------------------------------------------------------------
      - name: 🚀 Publish GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: Kanat Installer ${{ steps.version.outputs.new_tag }}
          prerelease: ${{ steps.prerelease_check.outputs.prerelease }}
          body_path: notes.md
          files: release_artifacts/**/*.tar
# ===================================================================
# 📘 NOTES
# ===================================================================
# - Docker images (QuestDB, Postgres, etc.) are NOT built here directly.
#   They are built internally by build_artifacts.sh via docker-compose.
# - The matrix ensures architecture compatibility (x64 ↔ ARM64).
# - Each platform produces a self-contained installer (.run inside .tar).
# - Release automation bumps version tags and attaches all artifacts.
