name: Build Cross-Platform Artifacts

on:
  workflow_run:
    workflows: ["Test PacketProcessingService"]
    types:
      - completed
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    name: 🏗️ Build installer (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-latest
            platform: linux-musl-x64
          - os: macos-latest
            platform: osx-arm64
          - os: windows-latest
            platform: win-x64
    env:
      KANAT_TARGET_RID: ${{ matrix.platform }}
      KANAT_BUILD_PLATFORM: ${{ matrix.platform }}
      DOCKER_BUILDKIT: 1
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🔁 Add python3 shim (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\shim" | Out-Null
          Set-Content -Path "$env:RUNNER_TEMP\shim\python3.cmd" -Value "@echo off`r`npython %*"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\shim"

      - name: ⚙️ Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 🐳 Start Docker (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          net start com.docker.service
          docker version

      - name: 🐳 Setup Docker Buildx
        if: runner.os != 'Windows'
        uses: docker/setup-buildx-action@v3

      - name: 📦 Install ORAS CLI
        uses: oras-project/setup-oras@v1

      - name: 🧱 Build installer
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_artifacts.sh
          ./build_artifacts.sh "${KANAT_BUILD_PLATFORM}"

      - name: 📂 List installer payload
        shell: bash
        run: |
          ls -R artifacts/installers || true

      - name: ⬆️ Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: artifacts/installers/${{ matrix.platform }}/installer-${{ matrix.platform }}.run

      - name: 🔐 Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          echo "${GH_TOKEN}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 🚀 Publish installer OCI artifact
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/kanatbackend-installer
        run: |
          oras push "${IMAGE_NAME}:${KANAT_BUILD_PLATFORM}" \
            artifacts/installers/${KANAT_BUILD_PLATFORM}/installer-${KANAT_BUILD_PLATFORM}.run:application/x-sh
