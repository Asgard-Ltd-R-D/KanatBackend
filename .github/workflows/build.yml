name: Build and Deploy Cross-Platform Artifacts

# ===================================================================
# 🔐 PERMISSIONS
# ===================================================================
permissions:
  contents: write # Allows creating and uploading releases
  actions: read # Allows reading workflow info
  checks: read # Optional – for workflow_run context
  packages: read # Optional – if you pull from GitHub Packages
  deployments: write # Optional – for GitHub Releases deployment metadata

# ===================================================================
# 🔔 TRIGGERS
# ===================================================================
on:
  # Run automatically after tests finish successfully
  workflow_run:
    workflows: ["Test PacketProcessingService"]
    types: [completed]

  # Allow manual run or local act testing
  workflow_dispatch:

  # Rebuild when relevant paths change
  push:
    paths:
      - "Composer_cli/**"
      - "PacketProcessingService/**"
      - ".github/workflows/build.yml"
    branches: ["main", "master", "feature/**", "fix/**"]
  pull_request:
    paths:
      - "Composer_cli/**"
      - "PacketProcessingService/**"
      - ".github/workflows/build.yml"
    branches: ["main", "master", "feature/**", "fix/**"]
# ===================================================================
# ⚙️ JOBS
# ===================================================================
jobs:
  build:
    name: Build Installers (Linux host, multi-arch)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    if: >
      ${{ github.event.workflow_run.conclusion == 'success' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'push' }}

    steps:
      # --------------------------------------------------------------
      # 1️⃣ Checkout source
      # --------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------------
      # 2️⃣ Setup environment
      # --------------------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Enable QEMU for cross-architecture builds
        uses: docker/setup-qemu-action@v3

      # Persistent Buildx builder bootstrap
      - name: Initialize Buildx builder
        run: |
          docker buildx create --use --name kanatbuilder || true
          docker buildx inspect --bootstrap

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Tk dependencies (Linux host)
        run: |
          sudo apt-get update
          sudo apt-get install -y tk-dev python3-tk

      # --------------------------------------------------------------
      # 3️⃣ Build and load all Docker images via docker-compose
      # --------------------------------------------------------------
      - name: Preload Dev and Prod Docker Images
        run: |
          set -e
          echo "🐳 Building and loading local images (dev + prod) before artifact build..."
          export DOCKER_DEFAULT_PLATFORM=${{ matrix.arch == 'x64' && 'linux/amd64' || 'linux/arm64' }}

          # Compose both environments with local build contexts
          docker compose -f docker-compose.dev.yml build
          docker compose -f docker-compose.prod.yml build

          echo "✅ Local QuestDB, Postgres, and Seq images built successfully."
          docker images | grep -E 'kanatbackend-questdb|postgres|seq' || true

      # --------------------------------------------------------------
      # 4️⃣ Run build_artifacts.sh (Composer will reuse local images)
      # --------------------------------------------------------------
      - name: Build and compress all targets for ${{ matrix.arch }}
        env:
          DOCKER_BUILDKIT: 1
          BUILDX_NO_DOCKER: 1
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.arch == 'x64' && 'linux/amd64' || 'linux/arm64' }}
        run: |
          set -e
          echo "🏗️ Building for architecture: ${{ matrix.arch }}"
          mkdir -p installers

          # Map to valid Composer build targets
          if [ "${{ matrix.arch }}" = "x64" ]; then
            platforms=("linux-x64" "win-x64" "osx-x64")
          else
            platforms=("linux-arm64" "win-arm64" "osx-arm64")
          fi

          sudo apt-get install -y zstd  # ensure zstd available

          for platform in "${platforms[@]}"; do
            file_name="kanatbackend-installer-${platform}"
            echo "🔧 Building $platform..."

            # Clean build directory
            rm -rf artifacts
            mkdir -p artifacts

            # Run Composer build
            bash ./build_artifacts.sh "$platform"

            # Create and compress archive
            echo "📦 Compressing installer..."
            tar -I 'zstd -19 --long=30 --ultra' -cvf "installers/${file_name}.tar.zst" -C artifacts .

            ls -lh "installers/${file_name}.tar.zst"
          done

      # --------------------------------------------------------------
      # 5️⃣ Upload artifacts (one per OS/arch)
      # --------------------------------------------------------------
      - name: Upload compressed installers
        uses: actions/upload-artifact@v4
        with:
          name: kanatbackend-installers-${{ matrix.arch }}
          path: installers/*.tar.zst
          compression-level: 0

  # ===================================================================
  # 🏁 CREATE RELEASE
  # ===================================================================
  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./collected_installers

      - name: Display collected installers
        run: ls -R ./collected_installers || true

      - name: Determine release type
        id: rel
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [[ "$BRANCH" == "main" || "$BRANCH" == "master" ]]; then
            echo "release_type=release" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == feature/* || "$BRANCH" == fix/* ]]; then
            echo "release_type=pre-release" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "release_type=unknown" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: ${{ steps.rel.outputs.release_type != 'unknown' }}
        with:
          tag_name: v${{ github.run_number }}
          name: "Kanat Build ${{ github.run_number }} - ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ steps.rel.outputs.prerelease }}
          files: |
            collected_installers/**/*.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
