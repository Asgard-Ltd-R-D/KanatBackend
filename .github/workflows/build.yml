name: Build Cross-Platform Artifacts

# ===================================================================
# 🔔 TRIGGERS
# ===================================================================
on:
  # Run automatically after tests finish successfully
  workflow_run:
    workflows: ["Test PacketProcessingService"]
    types: [completed]

  # Allow manual run or local act testing
  workflow_dispatch:

  # Rebuild when relevant paths change
  push:
    paths:
      - "Composer_cli/**"
      - "PacketProcessingService/**"
      - ".github/workflows/build.yml"
    branches:
      - "main"
      - "master"
      - "feature/**"
      - "fix/**"

  pull_request:
    paths:
      - "Composer_cli/**"
      - "PacketProcessingService/**"
      - ".github/workflows/build.yml"
    branches:
      - "main"
      - "master"
      - "feature/**"
      - "fix/**"

# ===================================================================
# 🏗️ BUILD LINUX INSTALLERS (Docker builds happen here)
# ===================================================================
jobs:
  build-linux:
    name: 🏗️ Build installer (${{ matrix.platform }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            skip_docker: "false"
          - platform: linux-arm64
            skip_docker: "false"

    env:
      KANAT_TARGET_RID: ${{ matrix.platform }}
      KANAT_BUILD_PLATFORM: ${{ matrix.platform }}
      KANAT_SKIP_DOCKER: ${{ matrix.skip_docker }}
      DOCKER_BUILDKIT: 1
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ♻️ Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: linux-nuget-${{ hashFiles('**/*.sln', '**/*.csproj') }}
          restore-keys: linux-nuget-

      - name: ♻️ Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: linux-pip-${{ hashFiles('build_artifacts.sh', 'composer.py') }}
          restore-keys: linux-pip-

      - name: ♻️ Cache Docker image exports
        if: matrix.skip_docker != 'true'
        uses: actions/cache@v4
        with:
          path: artifacts/releases/images
          key: docker-cache-${{ matrix.platform }}-${{ hashFiles('QuestDB/Dockerfile', 'docker-compose.dev.yml', 'docker-compose.prod.yml') }}
          restore-keys: docker-cache-${{ matrix.platform }}-

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ⚙️ Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 🐳 Setup Docker Buildx
        if: matrix.skip_docker != 'true'
        uses: docker/setup-buildx-action@v3

      - name: 🧱 Build installer
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_artifacts.sh
          ./build_artifacts.sh "${KANAT_BUILD_PLATFORM}"

      - name: 📦 Package installer tar
        shell: bash
        run: |
          mkdir -p artifacts/packages
          src_dir="artifacts/installers/${KANAT_BUILD_PLATFORM}"
          src_file="installer-${KANAT_BUILD_PLATFORM}.run"
          tar_path="artifacts/packages/kanat-installer-${KANAT_BUILD_PLATFORM}.tar"
          if [ ! -f "${src_dir}/${src_file}" ]; then
            echo "❌ Missing ${src_dir}/${src_file}" >&2
            exit 1
          fi
          tar -cf "${tar_path}" -C "${src_dir}" "${src_file}"
          echo "✅ Created ${tar_path}"

      - name: ⬆️ Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanat-installer-${{ matrix.platform }}
          path: artifacts/packages/kanat-installer-${{ matrix.platform }}.tar

      - name: 📤 Upload docker image cache
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: kanat-docker-image-cache
          path: artifacts/releases/images

  # ===================================================================
  # 🏗️ BUILD NON-LINUX INSTALLERS (Windows & macOS reuse cached Docker)
  # ===================================================================
  build-nonlinux:
    needs: build-linux
    name: 🏗️ Build installer (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
            skip_docker: "true"
          - os: windows-latest
            platform: win-arm64
            skip_docker: "true"
          - os: macos-latest
            platform: osx-arm64
            skip_docker: "true"
          - os: macos-13
            platform: osx-x64
            skip_docker: "true"

    env:
      KANAT_TARGET_RID: ${{ matrix.platform }}
      KANAT_BUILD_PLATFORM: ${{ matrix.platform }}
      KANAT_SKIP_DOCKER: ${{ matrix.skip_docker }}
      DOCKER_BUILDKIT: 1
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ♻️ Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: ♻️ Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('build_artifacts.sh', 'composer.py') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: 📥 Download docker image cache
        uses: actions/download-artifact@v4
        with:
          name: kanat-docker-image-cache
          path: artifacts/releases/images

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ⚙️ Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 🧱 Build installer
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./build_artifacts.sh
          ./build_artifacts.sh "${KANAT_BUILD_PLATFORM}"

      - name: 📦 Package installer tar
        shell: bash
        run: |
          mkdir -p artifacts/packages
          src_dir="artifacts/installers/${KANAT_BUILD_PLATFORM}"
          src_file="installer-${KANAT_BUILD_PLATFORM}.run"
          tar_path="artifacts/packages/kanat-installer-${KANAT_BUILD_PLATFORM}.tar"
          if [ ! -f "${src_dir}/${src_file}" ]; then
            echo "❌ Missing ${src_dir}/${src_file}" >&2
            exit 1
          fi
          tar -cf "${tar_path}" -C "${src_dir}" "${src_file}"
          echo "✅ Created ${tar_path}"

      - name: ⬆️ Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanat-installer-${{ matrix.platform }}
          path: artifacts/packages/kanat-installer-${{ matrix.platform }}.tar

  # ===================================================================
  # 🚀 RELEASE JOB — Creates tagged release or pre-release
  # ===================================================================
  release:
    name: 📦 Publish Release
    needs:
      - build-linux
      - build-nonlinux
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧮 Bump version tag
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: "v"
          release_branches: main,master,feature/*,fix/*
          dry_run: false

      - name: 📥 Download packaged installers
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          pattern: kanat-installer-*
          merge-multiple: true

      - name: 📝 Compose release notes
        run: |
          cat <<'EOF' > notes.md
          ## Installer Artifacts
          Automated build produced platform installers packaged as `.tar` files containing `installer-<platform>.run`.

          Platforms:
          - linux-x64
          - linux-arm64
          - win-x64
          - win-arm64
          - osx-arm64
          - osx-x64
          EOF

      # Dynamically set pre-release based on branch
      - name: ⚖️ Determine release type
        id: prerelease_check
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ]]; then
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Publish GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: Kanat Installer ${{ steps.version.outputs.new_tag }}
          prerelease: ${{ steps.prerelease_check.outputs.prerelease }}
          body_path: notes.md
          files: release_artifacts/**/*.tar
