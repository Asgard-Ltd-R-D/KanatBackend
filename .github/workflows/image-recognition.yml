name: Test ImageRecognitionService

on:
  push:
    paths:
      - ImageRecognitionService/**
      - .github/workflows/image-recognition.yml
  pull_request:
    paths:
      - ImageRecognitionService/**

jobs:
  test:
    name: 🎯 Test on ${{ github.ref_name }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ImageRecognitionService

    steps:
      - name: ⬆️ Check out repository
        uses: actions/checkout@v4

      - name: 🧰 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # requirements.txt minus ultralytics, which pulls torch (~2GB): the tests
      # inject a fake detector, so the model is never loaded here. The rest comes
      # from requirements.txt so the OpenCV pin test_environment.py checks holds.
      - name: 🔄 Install test dependencies
        run: pip install pytest -r <(grep -v '^ultralytics' requirements.txt)

      # The whole suite, not one file: #150 broke every live run on main while
      # this job, running only test_dedup.py, stayed green.
      - name: 🎯 Run tests
        run: python -m pytest -q
