name: WebApp CI

on:
  pull_request:
    branches: [main]
    paths: [WebApp/**]
  push:
    branches: [main, feature/**]
    paths: [WebApp/**]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebApp/backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

  frontend-typecheck:
    name: Frontend type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebApp/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: WebApp/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
