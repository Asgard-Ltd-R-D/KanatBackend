name: WebApp container

# The backend's image builds, and the compose file the range PC runs is
# valid, so a broken Dockerfile or compose entry is caught before a bundle
on:
  pull_request:
    branches: [main]
    paths: [WebApp/backend/**, WebApp/docker-compose*.yml, WebApp/observability/**, .github/workflows/webapp-container.yml]
  push:
    branches: [main, feature/**]
    paths: [WebApp/backend/**, WebApp/docker-compose*.yml, WebApp/observability/**, .github/workflows/webapp-container.yml]
  workflow_dispatch:

jobs:
  backend-image:
    name: Backend image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t kanat-backend:ci WebApp/backend

      # The app imports, and WeasyPrint finds its system libraries
      - name: Imports
        run: docker run --rm -e LOG_DIR=/tmp/kanat-logs kanat-backend:ci python -c "import app.main, weasyprint; print('ok')"

  compose:
    name: Compose file is valid
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebApp
    steps:
      - uses: actions/checkout@v4

      - name: Default and app profile
        run: |
          docker compose config -q
          docker compose --profile app config -q
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile app config -q
