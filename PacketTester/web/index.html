<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PacketTester - PCAP Replay Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="title-section">
                <h1>PacketTester</h1>
                <p class="subtitle">PCAP Replay Tool - Send packets over network interfaces</p>
            </div>
            <div class="action-buttons">
                <button id="fireBtn" class="btn btn-fire">▶ Fire</button>
                <button id="stopBtn" class="btn btn-stop" disabled>■ Stop</button>
            </div>
        </div>

        <!-- Configuration Card -->
        <div class="card">
            <h2 class="card-title">Configuration</h2>
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="interface">Network Interface</label>
                    <select id="interface" class="input-field">
                        <option value="">Loading...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="pcap">PCAP File</label>
                    <select id="pcap" class="input-field">
                        <option value="">Loading...</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Replay Options Card -->
        <div class="card">
            <h2 class="card-title">Replay Options</h2>
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="loop">Loop Count</label>
                    <input type="number" id="loop" class="input-field" value="1" min="1" max="1000">
                    <small class="help-text">Number of times to replay the PCAP</small>
                </div>

                <div class="form-group">
                    <label for="pps">Packets Per Second (PPS)</label>
                    <input type="number" id="pps" class="input-field" value="0" min="0">
                    <small class="help-text">0 = use original timing from PCAP</small>
                </div>
            </div>
        </div>

        <!-- Output Section -->
        <div class="card">
            <div class="output-header">
                <h2 class="card-title">Output</h2>
                <button id="clearBtn" class="btn btn-secondary">Clear</button>
            </div>
            <div id="output" class="output-box"></div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <span id="statusText">Ready</span>
            <span id="statusIndicator" class="status-indicator"></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
