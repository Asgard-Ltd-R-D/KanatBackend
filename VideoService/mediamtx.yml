# ---------- Logging ----------
logLevel: info
logDestinations: [stdout]

# ---------- Auth ----------
# Global auth
authMethod: internal
authInternalUsers:
  - user: any # 'any' matches any username, including anonymous (no creds)
    pass: # empty = no password
    ips: [] # empty = any IP
    permissions:
      - action: publish
        path: # empty = any path
      - action: read
        path:
      - action: playback
        path:
      # (optional) open these too; comment out if you don't want them public
      - action: api
        path:
      - action: metrics
      - action: pprof

# ---------- Protocol servers ----------
rtsp: yes
rtspTransports: [udp, multicast, tcp]
rtspEncryption: "no"
rtspAddress: :8554
rtspAuthMethods: [basic]

webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
# Only the Kanat app may open a stream: the packaged app (app://kanat) and the
# dev server
webrtcAllowOrigins: ["app://kanat", "http://localhost:5173"]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ""

# Serves recorded video to the WebApp backend (session replay), so only this PC
playback: yes
playbackAddress: 127.0.0.1:9996
playbackEncryption: no # (or yes with certs)

# The WebApp backend adds the camera paths and turns recording on and off
# through it, so only this PC
api: yes
apiAddress: 127.0.0.1:9997

# Everything else off
hls: no
rtmp: no
srt: no
metrics: no
pprof: no
# MoQ (new in v1.21, on by default): unused, and it would hold 8892-8893
moq: no

# ---------- Paths ----------
paths:
  loopdemo:
    source: publisher

    # runOnInit: ./run_loopdemo.sh
    runOnDemand: ./run_loopdemo.sh
    runOnDemandRestart: yes
    runOnDemandStartTimeout: 10s
    runOnDemandCloseAfter: 1s
