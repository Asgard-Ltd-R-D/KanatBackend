# The Detection Service on an NVIDIA GPU, in Docker (no longer how the range PC runs it:
# WebApp/deploy/windows installs it natively). Add this file (COMPOSE_FILE in .env) where
# Docker can use a GPU, so the CPU image runs otherwise. CUDA 12.6 PyTorch, which any CUDA 12 driver (525 on) runs, across the
# widest range of NVIDIA cards.
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile app build detection
services:
  detection:
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu126
    image: kanat-detection:${KANAT_VERSION:-dev}-cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
