# The WebApp's database. The backend runs on the PC itself, not here: it
# drives MediaMTX on 127.0.0.1 and reads VideoService/recordings (CONTEXT.md).
services:
  postgres:
    image: postgres:15-alpine
    container_name: webapp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - webapp_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  webapp_postgres_data:
