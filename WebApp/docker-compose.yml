# On the range PC, the WebApp backend and the Detection Service (profile "app").
# MediaMTX (VideoService) and the Electron app run on the PC
# itself: the cameras' multicast does not reach containers on Docker Desktop.
# The containers reach MediaMTX at host.docker.internal.
#
# The backend's database is a SQLite file on the webapp_db_data volume, so it
# survives a rebuild; it starts empty. Developing, the backend runs on the host
# against a local SQLite file (settings default), so no database container is needed.
#
# Settings it needs are in .env (.env.example).
#
# Logs: the backend writes backend.log, the app frontend.log and the Detection
# Service detection.log (JSON lines) in one folder, WebApp/logs here; on the
# range PC C:\ProgramData\Kanat\logs (or /var/log/kanat), set for this file with
# KANAT_LOG_DIR. The app's Logs tab reads these files directly
# (frontend/electron/logreader.ts), so there is no log stack to run. The backend
# answers on 127.0.0.1 only. The folder must exist, writable by the user running
# the app (and, developing, the backend and the Detection Service), before the
# first `up`; WebApp/logs is in the repo (kept empty) and start-all.sh makes
# KANAT_LOG_DIR; on the range PC the installer makes it.
#   docker compose --profile app up -d --build    the backend and the Detection Service, as on the range PC
services:
  # The backend, as start-all.sh runs it on this PC: it applies the
  # migrations, then answers the app on 127.0.0.1:8000.
  backend:
    profiles: ["app"]
    build: ./backend
    image: kanat-backend:${KANAT_VERSION:-dev}
    container_name: webapp-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # SQLite on the webapp_db_data volume, mounted at /data below
      DATABASE_URL: sqlite:////data/kanat.db
      MEDIAMTX_API_URL: http://host.docker.internal:9997
      # The Stream a Run watches, as the Detection Service's container reaches it
      MEDIAMTX_RTSP_URL: rtsp://host.docker.internal:8554
      DETECTION_SERVICE_URL: http://detection:8010
      MEDIAMTX_CONFIG: /video/mediamtx.yml
      LOG_DIR: /var/log/kanat
      # The PC's zone, so log timestamps are in local time
      TZ: ${KANAT_TZ:-Asia/Jerusalem}
    volumes:
      - webapp_db_data:/data
      - ${KANAT_LOG_DIR:-./logs}:/var/log/kanat
      - ${KANAT_VIDEO_DIR:-../VideoService}/mediamtx.yml:/video/mediamtx.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # The Detection Service (ImageRecognitionService): the backend starts and
  # ends its Runs over its control API, which only this network reaches; it
  # reads each camera's Stream from MediaMTX and posts Bullet Holes back.
  # `docker compose stop` sends SIGTERM: it ends its Run, posting what it
  # holds, within the grace period.
  detection:
    profiles: ["app"]
    build: ../ImageRecognitionService
    image: kanat-detection:${KANAT_VERSION:-dev}
    container_name: webapp-detection
    command: ["python", "-m", "detection.service", "--host", "0.0.0.0",
              "--backend-url", "http://backend:8000", "--log-dir", "/var/log/kanat"]
    environment:
      TZ: ${KANAT_TZ:-Asia/Jerusalem}
    volumes:
      - ${KANAT_LOG_DIR:-./logs}:/var/log/kanat
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  webapp_db_data:
