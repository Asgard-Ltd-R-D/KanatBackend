services:
  postgres:
    image: postgres:15-alpine
    container_name: webapp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - webapp_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: webapp-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pdb
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "uv run --no-dev --frozen alembic upgrade head &&
             uv run --no-dev --frozen uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  webapp_postgres_data:
