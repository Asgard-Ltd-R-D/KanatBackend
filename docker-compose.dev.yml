services:
  # Database Services
  questdb-dev:
    build:
      context: ./QuestDB
    container_name: questdb-packets-dev
    ports:
      - "8812:8812" # HTTP/Web Console
      - "9009:9009" # PostgreSQL wire protocol
      - "9000:9000" # QuestDB ILP
      - "9003:9003" # Health and metrics
    environment:
      - QDB_METRICS_ENABLED=TRUE
      - QDB_PG_USER=quest
      - QDB_PG_PASSWORD=quest
      - QDB_PG_DATABASE=PacketDBDev
    volumes:
      - questdb_data:/root/.questdb/db
      - questdb_logs:/root/.questdb/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9003"]
      interval: 10s
      timeout: 10s
      retries: 3

  postgresdb-dev:
    image: postgres:15-alpine
    container_name: postgres-range-dev
    ports:
      - "55432:5432" # PostgreSQL port
    environment:
      - POSTGRES_DB=pdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pdb"]
      interval: 10s
      timeout: 10s
      retries: 3

  # Packet Processing Service
  packetprocessing-dev:
    build:
      context: ./PacketProcessing
      dockerfile: Dockerfile
    container_name: packet-processing-dev
    # Use host network for direct packet capture access
    network_mode: host
    # Required capabilities for packet capture
    cap_add:
      - NET_RAW
      - NET_ADMIN
    ports:
      - "10901:10901"
    depends_on:
      questdb-dev:
        condition: service_healthy
      postgresdb-dev:
        condition: service_healthy
    environment:
      # Application environment
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:10901

      # Capture
      - CAPTURE_MODE=auto
      - READ_TIMEOUT_MS=50
      - KERNEL_BUFFER_MB=32
      - LOG_EVERY_MS=1000
    restart: unless-stopped
    privileged: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10901/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

volumes:
  questdb_data:
  questdb_logs:
  postgres_data:
