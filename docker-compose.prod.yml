services:
  # Database Services
  questdb-prod:
    image: kanatbackend-questdb-prod
    build:
      context: ./QuestDB
    container_name: questdb-packets-prod
    ports:
      - "8812:8812" # HTTP/Web Console
      - "9009:9009" # PostgreSQL wire protocol
      - "9000:9000" # QuestDB ILP
      - "9003:9003" # Health and metrics
    environment:
      - QDB_METRICS_ENABLED=TRUE
      - QDB_PG_USER=quest
      - QDB_PG_PASSWORD=quest
      - QDB_PG_DATABASE=PacketDBProd
    volumes:
      - questdb_data_prod:/root/.questdb/db
      - questdb_logs_prod:/root/.questdb/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9003"]
      interval: 10s
      timeout: 10s
      retries: 3

  postgresdb-prod:
    image: postgres:15-alpine
    container_name: postgres-range-prod
    ports:
      - "5432:5432" # PostgreSQL port
    environment:
      - POSTGRES_DB=pdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pdb"]
      interval: 10s
      timeout: 10s
      retries: 3

  seq:
    image: datalust/seq:latest
    container_name: seq-prod
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "admin"
      SEQ_FIRSTRUN_ADMINUSERNAME: "admin"
      SEQ_BINDINGS__0__URI: "http://0.0.0.0:80"
      SEQ_BINDINGS__1__URI: "http://0.0.0.0:5341"
    ports:
      - "5341:80"      
      - "5342:5341"
    volumes:
      - seq-data:/data 

volumes:
  questdb_data_prod:
  questdb_logs_prod:
  postgres_data_prod:
  seq-data:
