services:
  questdb:
    image: questdb/questdb:latest
    container_name: questdb-packet-processing
    ports:
      - "8812:8812" # HTTP/Web Console
      - "9009:9009" # PostgreSQL wire protocol
      - "9000:9000" # InfluxDB line protocol
    environment:
      - QDB_PG_USER=quest
      - QDB_PG_PASSWORD=quest
      - QDB_PG_DATABASE=qdb
    volumes:
      - questdb_data:/root/.questdb/db
      - questdb_logs:/root/.questdb/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8812/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgresdb:
    image: postgres:15-alpine
    container_name: postgres-packet-processing
    ports:
      - "5432:5432" # PostgreSQL port
    environment:
      - POSTGRES_DB=packet_processing
      - POSTGRES_USER=packet_user
      - POSTGRES_PASSWORD=packet_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packet_user -d packet_processing"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  questdb_data:
  questdb_logs:
  postgres_data:
