# ---------- Logging ----------
logLevel: info
logDestinations: [stdout]

# ---------- Auth ----------
# Global auth
authMethod: internal
authInternalUsers:
  - user: any # 'any' matches any username, including anonymous (no creds)
    pass: # empty = no password
    ips: [] # empty = any IP
    permissions:
      - action: publish
        path: # empty = any path
      - action: read
        path:
      - action: playback
        path:
      # (optional) open these too; comment out if you don't want them public
      - action: api
        path:
      - action: metrics
      - action: pprof

# ---------- Protocol servers ----------
rtsp: yes
rtspTransports: [udp, multicast, tcp]
rtspEncryption: "no"
rtspAddress: :8554
rtspAuthMethods: [basic]

webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcAllowOrigin: "*"
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ""

playback: yes
playbackAddress: :9996
playbackEncryption: no # (or yes with certs)

api: yes
apiAddress: :9997

# Everything else off
hls: no
rtmp: no
srt: no
metrics: no
pprof: no

# ---------- Paths ----------
paths:
  loopdemo:
    source: publisher

    runOnInit: ./run_loopdemo.sh

